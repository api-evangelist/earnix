name: Earnix
description: >-
  Earnix provides an AI orchestration system (Earnix AIOS) purpose-built for
  insurance and banking decisioning. The platform unifies pricing, an enterprise
  rating engine, automated underwriting, and real-time customer engagement so
  insurers and financial institutions can price smarter, underwrite faster, and
  engage customers better. Earnix serves 100+ leading insurers worldwide,
  processing billions of transactions annually and compressing rate creation
  from months to days. Earnix is a portfolio company of Insight Partners. This
  profile was enriched by the API Evangelist pipeline; Earnix is an enterprise
  B2B vendor with no public self-serve developer portal or API documentation.
